groups:
- name: BocaDeLoboAlerts
  rules:
  - alert: ApiDown
    expr: up{job="boca-de-lobo-api"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "MVP Boca de Lobo fora do ar"
      description: "O Prometheus não consegue raspar {{ $labels.instance }} há mais de 1 minuto."

  - alert: DadosDesatualizados
    expr: (time() - mapa_gerado_em_timestamp_seconds{job="boca-de-lobo-api"} > 26 * 3600) and mapa_gerado_em_timestamp_seconds{job="boca-de-lobo-api"} > 0
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "Mapa do cidadão desatualizado"
      description: "O mapa servido foi gerado há mais de 26 h: o pipeline de dados (Airflow/Databricks/Lambda) não publicou o retrato do dia. Moradores podem estar vendo risco antigo."

  - alert: MapaIndisponivel
    expr: absent(mapa_total_pontos{job="boca-de-lobo-api"}) or mapa_total_pontos{job="boca-de-lobo-api"} == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "API sem mapa para servir"
      description: "A API não conseguiu carregar nenhum mapa do DynamoDB (endpoint /api/v1/mapa responde 503)."

  - alert: FalhaLeituraDynamo
    expr: increase(mapa_leitura_falhas_total{job="boca-de-lobo-api"}[10m]) > 3
    for: 0m
    labels:
      severity: warning
    annotations:
      summary: "Falhas ao ler o DynamoDB"
      description: "A API está servindo a última versão em cache porque a leitura do DynamoDB falhou repetidamente."

  - alert: HighErrorRate
    expr: |
      sum(rate(http_requests_total{job="boca-de-lobo-api",http_status=~"5.."}[2m]))
        / clamp_min(sum(rate(http_requests_total{job="boca-de-lobo-api"}[2m])), 1e-9) > 0.05
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "Taxa de erros 5xx acima de 5%"
      description: "Mais de 5% das requisições estão falhando nos últimos 2 minutos."

  - alert: HighLatencyP95
    expr: |
      histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="boca-de-lobo-api"}[5m]))) > 2
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Latência p95 acima de 2s"
      description: "O p95 de latência está acima de 2 segundos há 5 minutos."
