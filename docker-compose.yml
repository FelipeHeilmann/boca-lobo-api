# Stack de produção executada no EC2 (imagem vinda do ECR, sem build e sem segredos)
# IMAGE_URI é gravado em /opt/boca-de-lobo/.env pelo job de deploy (via SSM).
services:
  api:
    image: ${IMAGE_URI:?defina IMAGE_URI}
    container_name: boca-de-lobo-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 1.5
    pids_limit: 200
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
