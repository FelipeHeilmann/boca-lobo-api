name: CI/CD - Boca de Lobo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_IMAGE: aquasec/trivy:0.58.1
  IMAGE_NAME: boca-de-lobo

jobs:
  # ---------------------------------------------------------------- SECRETS
  gitleaks:
    name: Gitleaks (segredos no histórico)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------- SAST
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.97.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Semgrep scan
        run: |
          semgrep scan --metrics=off --error \
            --config p/python \
            --config p/dockerfile \
            --config p/terraform \
            --config p/github-actions

  # ------------------------------------------------------------ IaC CHECKS
  terraform-check:
    name: Terraform fmt/validate + Trivy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
      - name: terraform fmt
        run: terraform fmt -check -recursive terraform
      - name: terraform validate
        working-directory: terraform
        run: terraform init -backend=false -input=false && terraform validate
      - name: Trivy misconfig scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" config \
            --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore terraform/

  # ------------------------------------------------------------------ TESTES
  tests:
    name: Testes (API + Lambda)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Instala dependências
        run: pip install -r app/requirements.txt pytest==8.4.2 "httpx<0.29"
      - name: pytest
        run: python -m pytest -q app/tests lambda/ingestor/tests

  # ---------------------------------------------------- BUILD + IMAGE SCAN
  build-scan:
    name: Docker build + Trivy image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build
        run: docker build -t "$IMAGE_NAME:$GITHUB_SHA" app
      - name: Verifica usuário não-root
        run: |
          uid=$(docker run --rm --entrypoint id "$IMAGE_NAME:$GITHUB_SHA" -u)
          echo "uid=$uid"; test "$uid" != "0"
      - name: Trivy image scan (HIGH/CRITICAL bloqueiam)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "$IMAGE_NAME:$GITHUB_SHA"
      - name: Trivy na imagem do proxy (Caddy, terceiro) — informativo
        run: |
          docker run --rm "$TRIVY_IMAGE" image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 \
            "$(grep -oE 'caddy:[^ ]+' docker-compose.yml)"
      - name: Exporta imagem
        if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
        run: docker save "$IMAGE_NAME:$GITHUB_SHA" | gzip > image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

  # ------------------------------------------------------ INFRA (Terraform)
  infra:
    name: Terraform apply
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
    needs: [gitleaks, semgrep, terraform-check, tests, build-scan]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_project: ${{ vars.TF_VAR_project || 'boca-de-lobo' }}
      TF_VAR_admin_cidrs: ${{ secrets.TF_VAR_admin_cidrs || '[]' }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
    outputs:
      instance_id: ${{ steps.out.outputs.instance_id }}
      public_ip: ${{ steps.out.outputs.public_ip }}
      ecr_repository_url: ${{ steps.out.outputs.ecr_repository_url }}
      site_host: ${{ steps.out.outputs.site_host }}
      dynamodb_table: ${{ steps.out.outputs.dynamodb_table }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform init
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"
      - name: terraform plan
        run: terraform plan -input=false -out=tfplan
      - name: terraform apply
        run: terraform apply -input=false tfplan
      - name: Outputs
        id: out
        run: |
          {
            echo "instance_id=$(terraform output -raw instance_id)"
            echo "public_ip=$(terraform output -raw public_ip)"
            echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)"
            echo "site_host=$(terraform output -raw site_host)"
            echo "dynamodb_table=$(terraform output -raw dynamodb_table)"
          } >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------- DEPLOY (ECR + SSM)
  deploy:
    name: Push ECR + deploy via SSM
    needs: infra
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      INSTANCE_ID: ${{ needs.infra.outputs.instance_id }}
      PUBLIC_IP: ${{ needs.infra.outputs.public_ip }}
      ECR_URL: ${{ needs.infra.outputs.ecr_repository_url }}
      SITE_HOST: ${{ needs.infra.outputs.site_host }}
      DYNAMODB_TABLE: ${{ needs.infra.outputs.dynamodb_table }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS || 'https://felipevoidela.github.io' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Push da imagem para o ECR
        run: |
          gunzip -c image.tar.gz | docker load
          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$ECR_URL:$GITHUB_SHA"
          docker push "$ECR_URL:$GITHUB_SHA"

      - name: Aguarda instância registrada no SSM
        run: |
          for i in $(seq 1 60); do
            status=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' --output text)
            echo "tentativa $i: $status"
            [ "$status" = "Online" ] && exit 0
            sleep 10
          done
          echo "Instância não ficou Online no SSM"; exit 1

      - name: Deploy (docker compose) via SSM Run Command
        run: |
          REGISTRY="${ECR_URL%%/*}"
          BUNDLE_B64=$(tar czf - docker-compose.yml caddy/Caddyfile | base64 -w0)
          ENV_B64=$(printf 'IMAGE_URI=%s\nSITE_HOST=%s\nDYNAMODB_TABLE=%s\nAWS_REGION=%s\nCORS_ORIGINS=%s\n' \
            "$ECR_URL:$GITHUB_SHA" "$SITE_HOST" "$DYNAMODB_TABLE" "$AWS_REGION" "$CORS_ORIGINS" | base64 -w0)
          jq -n \
            --arg bundle "$BUNDLE_B64" \
            --arg env "$ENV_B64" \
            --arg registry "$REGISTRY" \
            --arg region "$AWS_REGION" \
            '{commands: [
              "set -eu",
              "cloud-init status --wait > /dev/null || true",
              "cd /opt/boca-de-lobo",
              "echo \($bundle) | base64 -d | tar xzf -",
              "echo \($env) | base64 -d > .env",
              "mkdir -p caddy/data caddy/config && chown -R 10002:10002 caddy/data caddy/config",
              "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($registry)",
              "docker compose pull",
              "docker compose up -d --remove-orphans",
              "docker logout \($registry)",
              "docker image prune -f",
              "docker compose ps"
            ]}' > params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $GITHUB_SHA" \
            --parameters file://params.json \
            --query 'Command.CommandId' --output text)
          echo "CommandId: $CMD_ID"

          for i in $(seq 1 90); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "tentativa $i: $status"
            case "$status" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{Out:StandardOutputContent,Err:StandardErrorContent}' --output text
          test "$status" = "Success"

      - name: Smoke test (HTTPS)
        run: |
          # o primeiro deploy emite o certificado (Let's Encrypt): pode levar ~1 min
          for i in $(seq 1 36); do
            if curl -fsS "https://$SITE_HOST/health"; then
              echo; echo "API no ar: https://$SITE_HOST/api/v1/mapa"
              exit 0
            fi
            sleep 5
          done
          exit 1
